services:
  web:
    build: .
    container_name: app_horarios_web
    restart: always
    volumes:
      - static_volume:/app/static
    env_file:
      - .env
    expose:
      - "8000"

  nginx:
    image: nginx:alpine
    container_name: app_horarios_nginx
    restart: always
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - static_volume:/app/static
    depends_on:
      - web

volumes:
  static_volume: